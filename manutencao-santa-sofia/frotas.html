<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frotas - Faz. Santa Sofia</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#1f2a1f;--mu:#667066;--bd:#d9dfd6;--ac:#2e6b34;--ac2:#e8f1e6;--rd:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161a16;--card:#202520;--tx:#e8ede6;--mu:#9aa59a;--bd:#333b33;--ac:#6fbf76;--ac2:#27352a;--rd:#f2877f}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:1000px;margin:auto}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.nav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.nav a{padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-decoration:none;font-size:14px}
.nav a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on{background:var(--ac2);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.grid input,.grid select{width:100%}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--ac2);color:var(--ac)}
.tag.in{background:#f6e3e1;color:var(--rd)}
@media (prefers-color-scheme:dark){.tag.in{background:#3a2422}}
#msg{font-size:13px;margin:8px 0;min-height:18px}.err{color:var(--rd)}
#rel{display:none}
@media print{body{background:#fff;color:#000}.noprint,#msg{display:none!important}#rel{display:block}.card{border:0}}
</style>
</head>
<body>
<h1 class="noprint">Frotas</h1>
<div class="sub noprint">Manutenção - Faz. Santa Sofia</div>
<div class="nav noprint"><a href="./">Gastos / Revisões</a><a href="frotas.html" class="on">Frotas</a></div>

<div class="card noprint">
  <div class="bar">
    <button id="bNovo" class="pri">+ Nova frota</button>
    <button data-f="todas" class="fl on">Todas</button>
    <button data-f="ativas" class="fl">Ativas</button>
    <button data-f="inativas" class="fl">Inativas</button>
    <input id="busca" placeholder="Buscar..." style="flex:1;min-width:140px">
    <button id="bRel">Relatório Ativas / Inativas</button>
  </div>
  <div id="msg"></div>
</div>

<div class="card noprint" id="form" style="display:none">
  <b id="fTitulo">Nova frota</b>
  <div class="grid" style="margin-top:10px">
    <div><label>Frota</label><input id="fFrota"></div>
    <div><label>Tipo</label><select id="fTipo"></select></div>
    <div><label>Nome</label><input id="fNome"></div>
    <div><label>Fabricante</label><input id="fFab"></div>
    <div><label>Modelo</label><input id="fMod"></div>
    <div><label>Ano</label><input id="fAno" inputmode="numeric" maxlength="4"></div>
    <div><label>Situação</label><select id="fAtiva"><option value="1">Ativa</option><option value="0">Inativa</option></select></div>
  </div>
  <div class="bar" style="margin-top:12px"><button id="bSalvar" class="pri">Salvar</button><button id="bCancel">Cancelar</button></div>
</div>

<div class="card noprint"><div class="wrap"><table>
<thead><tr><th></th><th>Frota</th><th>Tipo</th><th>Nome</th><th>Fabricante</th><th>Modelo</th><th>Ano</th><th>Situação</th></tr></thead>
<tbody id="lista"></tbody></table></div></div>

<div id="rel"></div>

<script src="js/config.js"></script>
<script>
const CFG = window.SS_CONFIG || {};
const URL_SCRIPT = CFG.API_URL || 'https://script.google.com/macros/s/AKfycbxKkFzrgionJL0pJZEywUeuf838V9t25hgLGozPwyQUZFYXHJTTS3lCiXgoxI7YmlX0/exec';
const CHAVE = CFG.DATA_KEY || 'manutencao_santa_sofia';
const TIPOS = ['Trator','Pulverizador','Colheitadeira','Implemento','Semeadora','Distribuidor de fertilizante','Veículos','Motocicletas','Equipamentos'];
const IMPL = ['Implemento','Semeadora','Distribuidor de fertilizante'];

let dados = null, filtro = 'todas', editando = null, senha = '';
try { senha = sessionStorage.getItem('ss_manut_pin') || ''; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msg = (t, e) => { $('msg').textContent = t || ''; $('msg').className = e ? 'err' : ''; };

$('fTipo').innerHTML = TIPOS.map(t => '<option>' + t + '</option>').join('');

function jsonp(params) {
  return new Promise((ok, fail) => {
    const cb = 'cb' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); fail(new Error('tempo esgotado')); }, 20000);
    function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = r => { cleanup(); ok(r); };
    s.onerror = () => { cleanup(); fail(new Error('falha de rede')); };
    s.src = URL_SCRIPT + '?' + new URLSearchParams({ ...params, callback: cb });
    document.head.appendChild(s);
  });
}

async function carregar() {
  msg('Carregando...');
  try {
    const r = await jsonp({ key: CHAVE });
    dados = r.value ? JSON.parse(r.value) : null;
    if (!dados) { msg('Não encontrei dados na planilha. Nada foi alterado.', true); return false; }
    dados.maquinas = dados.maquinas || {};
    msg('');
    desenhar();
    return true;
  } catch (e) { msg('Erro ao carregar: ' + e.message, true); return false; }
}

const ehAtiva = m => m.ativa !== false;
const tipoDe = m => m.tipoFrota || m.tipo || '';
const nomeFrota = m => m.frota || m.nome || '';
const fab = m => m.fabricante || m.marca || '';

function lista() {
  const q = $('busca').value.trim().toLowerCase();
  return Object.keys(dados.maquinas).map(id => ({ id, m: dados.maquinas[id] }))
    .filter(x => x.m && !x.m.exemplo)
    .filter(x => filtro === 'todas' || (filtro === 'ativas') === ehAtiva(x.m))
    .filter(x => !q || [nomeFrota(x.m), x.m.nome, tipoDe(x.m), fab(x.m), x.m.modelo, x.m.ano].join(' ').toLowerCase().includes(q))
    .sort((a, b) => nomeFrota(a.m).localeCompare(nomeFrota(b.m), 'pt-BR', { numeric: true }));
}

function desenhar() {
  if (!dados) return;
  const l = lista();
  $('lista').innerHTML = l.length ? l.map(({ id, m }) =>
    '<tr><td><button data-ed="' + id + '">Editar</button></td><td><b>' + esc(nomeFrota(m)) + '</b></td><td>' + esc(tipoDe(m)) + '</td><td>' + esc(m.nome) + '</td><td>' + esc(fab(m)) +
    '</td><td>' + esc(m.modelo) + '</td><td>' + esc(m.ano) + '</td><td><span class="tag ' + (ehAtiva(m) ? '' : 'in') + '">' + (ehAtiva(m) ? 'Ativa' : 'Inativa') +
    '</span></td></tr>').join('')
    : '<tr><td colspan="8" style="color:var(--mu)">Nenhuma frota encontrada.</td></tr>';
}

function abrirForm(id) {
  editando = id;
  const m = id ? dados.maquinas[id] : {};
  $('fTitulo').textContent = id ? 'Editar frota' : 'Nova frota';
  $('fFrota').value = m.frota || m.nome || '';
  $('fNome').value = m.nome || '';
  $('fFab').value = fab(m);
  $('fMod').value = m.modelo || '';
  $('fAno').value = m.ano || '';
  $('fAtiva').value = ehAtiva(m) ? '1' : '0';
  const t = tipoDe(m);
  $('fTipo').innerHTML = TIPOS.concat(t && !TIPOS.includes(t) ? [t] : []).map(x => '<option>' + esc(x) + '</option>').join('');
  $('fTipo').value = t || TIPOS[0];
  $('form').style.display = 'block';
  $('form').scrollIntoView({ behavior: 'smooth' });
}

async function pedirSenha() {
  if (senha) return true;
  const s = prompt('Senha para alterar:');
  if (!s) return false;
  try {
    const r = await jsonp({ action: 'check', senha: s });
    if (r.ok) { senha = s; try { sessionStorage.setItem('ss_manut_pin', s); } catch (e) {} return true; }
  } catch (e) {}
  msg('Senha incorreta.', true);
  return false;
}

async function salvar() {
  const frota = $('fFrota').value.trim();
  if (!frota) { msg('Informe a Frota.', true); return; }
  if (!(await pedirSenha())) return;
  msg('Salvando...');
  // relê a planilha antes de gravar, para não apagar alterações feitas por outra pessoa
  if (!(await carregar())) return;
  const id = editando && dados.maquinas[editando] ? editando : 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const novo = !dados.maquinas[id];
  const m = dados.maquinas[id] || { horimetroAtual: 0 };
  const tipo = $('fTipo').value;
  const tipoAntes = tipoDe(m);
  m.frota = frota;
  m.nome = $('fNome').value.trim() || frota;
  m.tipoFrota = tipo;
  m.fabricante = $('fFab').value.trim();
  m.marca = m.fabricante;
  m.modelo = $('fMod').value.trim();
  m.ano = $('fAno').value.trim();
  m.ativa = $('fAtiva').value === '1';
  if (novo || tipo !== tipoAntes) { m.tipo = tipo; m.classe = IMPL.includes(tipo) ? 'implemento' : 'maquina'; }
  dados.maquinas[id] = m;
  dados.atualizadoEm = new Date().toISOString() + '#' + Math.random().toString(36).slice(2, 7);
  try {
    await fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ senha, key: CHAVE, value: JSON.stringify(dados) }) });
    // a resposta do POST não é legível; confere na planilha se a gravação foi aceita
    const r = await jsonp({ key: CHAVE });
    const conf = r.value ? JSON.parse(r.value) : null;
    if (!conf || conf.atualizadoEm !== dados.atualizadoEm) {
      senha = ''; try { sessionStorage.removeItem('ss_manut_pin'); } catch (e) {}
      msg('Não salvou: senha incorreta ou falha de conexão. Tente de novo.', true); return;
    }
    $('form').style.display = 'none';
    await carregar();
    msg('Salvo com sucesso.');
  } catch (e) { msg('Erro ao salvar: ' + e.message, true); }
}

function relatorio() {
  if (!dados) return;
  const todas = Object.keys(dados.maquinas).map(id => dados.maquinas[id]).filter(m => m && !m.exemplo);
  const bloco = (tit, arr) => '<h2>' + tit + ' (' + arr.length + ')</h2><table><thead><tr><th>Frota</th><th>Tipo</th><th>Nome</th><th>Fabricante</th><th>Modelo</th><th>Ano</th></tr></thead><tbody>' +
    arr.sort((a, b) => nomeFrota(a).localeCompare(nomeFrota(b), 'pt-BR', { numeric: true })).map(m =>
      '<tr><td>' + esc(nomeFrota(m)) + '</td><td>' + esc(tipoDe(m)) + '</td><td>' + esc(m.nome) + '</td><td>' + esc(fab(m)) + '</td><td>' + esc(m.modelo) + '</td><td>' + esc(m.ano) + '</td></tr>').join('') + '</tbody></table>';
  $('rel').innerHTML = '<h1>Relatório de Frotas - Faz. Santa Sofia</h1><div class="sub">Emitido em ' + new Date().toLocaleDateString('pt-BR') + '</div>' +
    bloco('Frotas Ativas', todas.filter(ehAtiva)) + bloco('Frotas Inativas', todas.filter(m => !ehAtiva(m)));
  window.print();
}

$('bNovo').onclick = () => dados ? abrirForm(null) : msg('Aguarde o carregamento.', true);
$('bCancel').onclick = () => { $('form').style.display = 'none'; };
$('bSalvar').onclick = salvar;
$('bRel').onclick = relatorio;
$('busca').oninput = desenhar;
document.querySelectorAll('.fl').forEach(b => b.onclick = () => {
  filtro = b.dataset.f; document.querySelectorAll('.fl').forEach(x => x.classList.toggle('on', x === b)); desenhar();
});
$('lista').onclick = e => { const id = e.target.dataset.ed; if (id) abrirForm(id); };

if (URL_SCRIPT.startsWith('COLE_AQUI')) msg('Falta colar o link do Apps Script na constante URL_SCRIPT (início do código).', true);
else carregar();
</script>
</body>
</html>
